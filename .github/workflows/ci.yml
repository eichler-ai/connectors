# CI for the connectors repo.
#
# What runs here and what deliberately does not (see CONTRIBUTING.md's testing-tiers section):
#
#   - MCP Server (Go): the full tier-1 suite — gofmt, go vet, `go test -race`, plus a
#     GOOS=windows cross-compile check, since the primary shipping target is Windows (PRD §04)
#     while these runners are Linux.
#   - Test harness (Go): type-check only, including its `harness`-tagged test files. The tests
#     themselves need a live Revit + broker stack by design (tier 2) and are never run in CI.
#   - Hub (Go): the same tier-1 discipline for the root module — hub/ plus every connector it links
#     (excel/); the Revit modules and excel/poc have their own go.mod and are excluded. Everything
#     here is pure logic over sockets and a fake bridge; the one thing CI cannot do is drive Excel
#     for the web, which stays a live test against a running hub (hub/README.md).
#   - MCP Bridge (C#): the tier-1 test suites (MCPBridge.Core.Tests, MCPBridge.Discovery.Tests) on
#     both TFMs (net8.0-windows -> Revit 2025, net10.0-windows -> Revit 2027), built against the
#     Nice3point.Revit.Api.* NuGet reference assemblies instead of a real Revit install (issue #39,
#     -p:UseNuGetRevitApi=true; see revit/mcp-bridge/Directory.Build.props). Runs on windows-latest,
#     the product's own platform; only the tier-1 test closure is built (Core, RevitAdapter,
#     Eichler.Connectors.Revit), never MCPBridge.AddIn/Shim (WPF + code signing, Windows-Revit-only).
#     What CI still cannot cover: anything needing a live Revit process (tier 2, the test-harness) and
#     the Discovery real-corpus tests that reflect over the actual installed RevitAPI.dll — those skip
#     with no install, exactly as they do on any dev Mac, and stay part of the VM-side release gate.
#     The job asserts on the executed-test COUNT per leg, not just the exit code: this repo has been
#     bitten by `dotnet test` exiting 0 while silently skipping an entire assembly (see the
#     revit-connector-development skill), and a green job that tests nothing is worse than no job. Do
#     not weaken that assertion, and do not add a job that "builds" the add-in without the real Revit
#     references (a NuGet-referenced add-in is not what ships).

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mcp-server:
    name: MCP Server (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: revit/mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: revit/mcp-server/go.mod
          cache-dependency-path: revit/mcp-server/go.sum
      # search_functions' two ranking models are fetched (pinned by sha256) into
      # the shared servercore module's semsearch/models/assets for go:embed.
      # Fetching here means the test run exercises the real bundled state, and
      # the cross-compile below measures the real shipped binary size.
      - name: fetch search_functions models
        run: ../../internal/servercore/semsearch/models/fetch-models.sh
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:" && echo "$unformatted" && exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test -race
        run: go test -race ./...
      # Re-runs one test verbosely purely to SURFACE its headroom line. `go test` discards a passing
      # package's output entirely -- t.Logf, stdout and stderr alike -- so a warn-on-pass check is
      # invisible without this, which is exactly the trap the first version of the skill.md budget's
      # soft line fell into. Cheap (one already-compiled test), and it is what makes the soft line a
      # real signal rather than dead code.
      - name: skill.md budget headroom
        run: go test -v -run TestSkillFileStaysWithinItsLightweightBudget ./internal/mcpserver/
      - name: cross-compile the Windows build (primary shipping target)
        run: GOOS=windows GOARCH=amd64 go build ./...
      # The broker's staleness guard (issue #116) rests entirely on the Go toolchain stamping the
      # source revision into the binary automatically, with no -ldflags. That is silent when it
      # stops working -- a -buildvcs=false or -trimpath added anywhere, or a build from a tree the
      # toolchain does not recognise as a checkout, and every binary reports "unknown" forever with
      # nothing else to notice. This asserts a plain `go build` (exactly what a developer runs, and
      # what install-mac.sh runs) still produces a binary that knows its own revision.
      - name: assert a plain build carries its source revision
        run: |
          go build -o /tmp/mcp-server-provenance-check ./cmd/mcp-server
          line="$(/tmp/mcp-server-provenance-check -version)"
          echo "$line"
          case "$line" in
            *unknown*) echo "the built broker reports no source revision -- VCS stamping is off; see internal/buildinfo" && exit 1 ;;
          esac

  servercore:
    name: Server core (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: internal/servercore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: internal/servercore/go.mod
          cache-dependency-path: internal/servercore/go.sum
      - name: fetch search_functions models
        run: ./semsearch/models/fetch-models.sh
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:" && echo "$unformatted" && exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test -race
        run: go test -race ./...

  installer:
    name: Installer (PowerShell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # install.ps1's pure parts -- the release manifest, per-component change detection and the
      # broker stage-and-swap -- run under pwsh anywhere (howto-seed-plan.md §1, step 5). The
      # deploy loop itself needs a Windows machine with Revit and stays live-only. Ubuntu runners
      # ship pwsh with Pester 5.
      - name: parse install.ps1
        shell: pwsh
        run: |
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/revit/install.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Host $_ }; throw "install.ps1 does not parse" }
      - name: Pester
        shell: pwsh
        run: |
          $r = Invoke-Pester -Path revit/install.tests.ps1 -Output Detailed -PassThru
          if ($r.FailedCount -gt 0 -or $r.PassedCount -eq 0) { throw "installer tests: $($r.PassedCount) passed, $($r.FailedCount) failed" }

  mcp-bridge:
    name: MCP Bridge (C#) tier-1 tests
    # windows-latest, not ubuntu: the C# add-in is a Windows-only product (PRD §04), so its tier-1
    # suites run on their own platform. The runner has no Revit install, so -p:UseNuGetRevitApi=true
    # swaps every RevitAPI/RevitAPIUI file reference for the Nice3point reference-assembly packages
    # (issue #39; revit/mcp-bridge/Directory.Build.props).
    runs-on: windows-latest
    defaults:
      run:
        working-directory: revit/mcp-bridge
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          # Both runtimes the suites execute on: the net8.0-windows leg (Revit 2025) runs on the .NET 8
          # runtime and the net10.0-windows leg (Revit 2027) on .NET 10 -- the same two-runtime setup the
          # dev VM uses so the legs genuinely differ (see MCPBridge.Core.Tests.csproj's RollForward note).
          dotnet-version: |
            8.0.x
            10.0.x
      - name: dotnet test — both suites, both TFMs, NuGet Revit API (no Revit install)
        run: |
          $projects = @(
            'tests/MCPBridge.Core.Tests/MCPBridge.Core.Tests.csproj',
            'tests/MCPBridge.Discovery.Tests/MCPBridge.Discovery.Tests.csproj'
          )
          $tfms = @('net8.0-windows', 'net10.0-windows')
          $results = Join-Path $PWD 'TestResults'
          Remove-Item -Recurse -Force $results -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $results | Out-Null
          # Run each (suite x TFM) leg explicitly so a missing leg is a missing trx, not a silent gap.
          foreach ($p in $projects) {
            foreach ($tfm in $tfms) {
              $name = "$([IO.Path]::GetFileNameWithoutExtension($p)).$tfm.trx"
              dotnet test $p -f $tfm -p:UseNuGetRevitApi=true `
                --logger "trx;LogFileName=$name" --results-directory $results
              if ($LASTEXITCODE -ne 0) { throw "dotnet test failed: $p ($tfm)" }
            }
          }
          # Assert on the executed COUNT, not the exit code: `dotnet test` exits 0 even when it ran zero
          # tests (e.g. an assembly silently skipped for an unresolved reference), the exact trap this
          # repo has been bitten by. Require all four legs present, each with tests run and none failing.
          $trx = @(Get-ChildItem $results -Filter *.trx)
          if ($trx.Count -ne 4) { throw "expected 4 trx files (2 suites x 2 TFMs), found $($trx.Count)" }
          foreach ($f in $trx) {
            [xml]$doc = Get-Content $f.FullName
            $c = $doc.TestRun.ResultSummary.Counters
            $total = [int]$c.total; $passed = [int]$c.passed; $failed = [int]$c.failed
            Write-Host ("{0}: total={1} passed={2} failed={3}" -f $f.Name, $total, $passed, $failed)
            if ($total -le 0) { throw "$($f.Name) executed 0 tests — a green job that tests nothing" }
            if ($failed -gt 0) { throw "$($f.Name) had $failed failing test(s)" }
          }
          Write-Host "All 4 legs executed tests with 0 failures."

  rhino-mcp-server:
    name: Rhino MCP Server (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rhino/mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: rhino/mcp-server/go.mod
          cache-dependency-path: rhino/mcp-server/go.sum
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:" && echo "$unformatted" && exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test -race
        run: go test -race ./...
      - name: cross-compile the Windows and macOS builds
        run: |
          GOOS=windows GOARCH=amd64 go build ./...
          GOOS=darwin GOARCH=arm64 go build ./...
      - name: assert a plain build carries its source revision
        run: |
          go build -o /tmp/rhino-mcp-server-provenance-check ./cmd/mcp-server
          line="$(/tmp/rhino-mcp-server-provenance-check -version)"
          echo "$line"
          case "$line" in
            *unknown*) echo "the built server reports no source revision -- VCS stamping is off; see internal/servercore/buildinfo" && exit 1 ;;
          esac
      # Re-runs one test verbosely purely to SURFACE its headroom line. `go test` discards a passing
      # package's t.Logf, so the skill.md budget's soft-line warning is invisible without this.
      - name: skill.md budget headroom
        run: go test -v -run TestSkillFileStaysWithinItsBudget ./internal/mcpserver/

  rhino-mcp-bridge:
    name: Rhino MCP Bridge (C#) tier-1 tests
    # RhinoCommon is a managed NuGet package, so the tier-1 suite builds and runs on any OS with no
    # Rhino install (rhino/docs/implementation-plan.md "Tiers") -- the difference from the Revit job
    # above. Both platforms the product ships on, because the suite has platform-conditional cases
    # (file permissions, memory sampling) and a leg that silently skips is the trap this repo knows.
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rhino/mcp-bridge
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: dotnet test, asserting on the executed count
        run: |
          $results = Join-Path $PWD 'TestResults'
          Remove-Item -Recurse -Force $results -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $results | Out-Null
          $proj = 'tests/Rhino.MCPBridge.Core.Tests/Rhino.MCPBridge.Core.Tests.csproj'
          # Discover first: a test host that CRASHES mid-run (RhinoCommon's native core is one way --
          # any tier-1 test that trips RhinoDoc's type initializer kills the host) still makes
          # `dotnet test` print "Passed!" for whatever ran before the crash. The executed count in the
          # trx must equal the discovered count, or the run proved nothing.
          $listed = @(dotnet test $proj --list-tests --nologo 2>$null | Where-Object { $_ -match '^\s+Rhino\.MCPBridge\.Core\.Tests\.' })
          $discovered = $listed.Count
          dotnet test $proj --logger "trx;LogFileName=core.trx" --results-directory $results
          if ($LASTEXITCODE -ne 0) { throw "dotnet test failed" }
          $trx = @(Get-ChildItem $results -Filter *.trx)
          if ($trx.Count -ne 1) { throw "expected 1 trx file, found $($trx.Count)" }
          [xml]$doc = Get-Content $trx[0].FullName
          $c = $doc.TestRun.ResultSummary.Counters
          $total = [int]$c.total; $passed = [int]$c.passed; $failed = [int]$c.failed
          Write-Host ("core.trx: discovered={0} total={1} passed={2} failed={3}" -f $discovered, $total, $passed, $failed)
          if ($total -le 0) { throw "executed 0 tests -- a green job that tests nothing" }
          if ($failed -gt 0) { throw "$failed failing test(s)" }
          # --list-tests prints one line per test CASE (theory rows expanded), like the trx counts them.
          if ($discovered -gt 0 -and $total -lt $discovered) { throw "executed $total of $discovered discovered tests -- the test host most likely crashed mid-run (check for DllNotFoundException rhcommon_c)" }
      - name: discovery tier-1 tests, asserting on the executed count
        run: |
          $results = Join-Path $PWD 'TestResults-Discovery'
          Remove-Item -Recurse -Force $results -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $results | Out-Null
          $proj = 'tests/Rhino.MCPBridge.Discovery.Tests/Rhino.MCPBridge.Discovery.Tests.csproj'
          # Same discipline as the Core.Tests step: the discovery suite reflects the real RhinoCommon
          # assembly, so a host that trips a native initializer mid-run would still print "Passed!" for
          # what ran before it. Assert the trx executed count equals the discovered count.
          $listed = @(dotnet test $proj --list-tests --nologo 2>$null | Where-Object { $_ -match '^\s+Rhino\.MCPBridge\.Discovery\.Tests\.' })
          $discovered = $listed.Count
          dotnet test $proj --logger "trx;LogFileName=discovery.trx" --results-directory $results
          if ($LASTEXITCODE -ne 0) { throw "dotnet test failed" }
          $trx = @(Get-ChildItem $results -Filter *.trx)
          if ($trx.Count -ne 1) { throw "expected 1 trx file, found $($trx.Count)" }
          [xml]$doc = Get-Content $trx[0].FullName
          $c = $doc.TestRun.ResultSummary.Counters
          $total = [int]$c.total; $failed = [int]$c.failed
          Write-Host ("discovery.trx: discovered={0} total={1} failed={2}" -f $discovered, $total, $failed)
          if ($total -le 0) { throw "executed 0 discovery tests -- a green job that tests nothing" }
          if ($failed -gt 0) { throw "$failed failing test(s)" }
          if ($discovered -gt 0 -and $total -lt $discovered) { throw "executed $total of $discovered discovered tests -- the test host most likely crashed mid-run" }
      - name: build the plug-in (Release, the artifact the deploy script packages)
        run: dotnet build src/Rhino.MCPBridge.PlugIn/Rhino.MCPBridge.PlugIn.csproj -c Release -nologo -v q

  rhino-test-harness:
    name: Rhino test harness type-check (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rhino/test-harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: rhino/test-harness/go.mod
      - name: go vet (harness build tag; the tier-2 cases need a live Rhino)
        run: go vet -tags harness ./...

  test-harness:
    name: Test harness type-check (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: revit/test-harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: revit/test-harness/go.mod
          # No go.sum in this module (zero external deps) — setup-go's cache would fail
          # looking for one.
          cache: false
      - name: go vet (harness build tag — compiles the tier-2 test files without running them)
        run: go vet -tags harness ./...

  hub:
    name: Hub (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # The root module: hub/, excel/connector, excel/addin, internal/. `./...` does not descend
      # into revit/* or excel/poc (their own go.mod), which is intended.
      - name: gofmt
        run: |
          unformatted="$(gofmt -l hub excel/connector excel/addin internal)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:" && echo "$unformatted" && exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test -race
        run: go test -race ./...
      # Same reason as the Revit job's headroom step: a passing package's t.Logf is discarded,
      # so the budget line is only visible when the test is re-run verbosely.
      - name: skill.md budget headroom
        run: go test -v -run TestSkillFileStaysWithinItsBudget ./excel/connector/
      # The image build is a plain static build with the same flags as hub/Dockerfile; asserting
      # it here catches a CGO regression without needing Docker.
      - name: go build (static, as the Dockerfile does)
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /tmp/hub ./hub/cmd/hub
