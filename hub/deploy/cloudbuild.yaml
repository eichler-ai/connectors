# Builds the hub image from the repo root, which is the build context the
# Dockerfile requires (it links hub/, excel/ and internal/). Invoked by
# deploy.sh with substitutions _IMAGE (full Artifact Registry tag) and
# _VERSION (short git revision, +"-dirty" if the tree was dirty), which is
# linked into the binary as main.buildVersion (hub/cmd/hub/main.go).
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - -f
      - hub/Dockerfile
      - --build-arg
      - VERSION=${_VERSION}
      - -t
      - ${_IMAGE}
      - .
images:
  - ${_IMAGE}
options:
  logging: CLOUD_LOGGING_ONLY
