name: Bridge probe
description: Does a Script Lab snippet run, and can it open wss://localhost:3000?
host: EXCEL
api_set: {}
script:
  content: |
    var out = document.getElementById("out");
    out.textContent = "script ran at " + new Date().toISOString() + "\norigin=" + location.origin + "\n";
    try {
      var ws = new WebSocket("wss://localhost:3000/ws");
      ws.onopen = function () { out.textContent += "socket OPEN\n"; ws.send(JSON.stringify({ type: "hello", host: "ScriptLab", platform: "probe", version: "0", workbook: "" })); };
      ws.onerror = function () { out.textContent += "socket ERROR (see close code)\n"; };
      ws.onclose = function (e) { out.textContent += "socket CLOSED code=" + e.code + " reason=" + e.reason + "\n"; };
    } catch (e) {
      out.textContent += "WebSocket constructor threw: " + e.message + "\n";
    }
  language: javascript
template:
  content: |
    <pre id="out">template rendered, script not run yet</pre>
  language: html
style:
  content: ""
  language: css
libraries: |
  https://appsforoffice.microsoft.com/lib/1/hosted/office.js
