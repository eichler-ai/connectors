<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Excel MCP Bridge</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    body { font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; padding: 12px; color: #222; }
    h1 { font-size: 15px; margin: 0 0 8px; }
    #status { padding: 6px 8px; border-radius: 4px; background: #eee; margin-bottom: 8px; }
    #status.ok { background: #dff5dd; }
    #status.bad { background: #fde2e2; }
    #env { color: #666; font-size: 12px; margin-bottom: 8px; white-space: pre-wrap; }
    #account { margin-bottom: 8px; }
    #account .who { margin-right: 8px; }
    #log { font: 11px/1.35 ui-monospace, Menlo, monospace; white-space: pre-wrap; background: #fafafa;
           border: 1px solid #ddd; padding: 6px; max-height: 55vh; overflow: auto; }
    .err { color: #b00020; }
    button { font-size: 12px; margin-right: 6px; }
    button.primary { background: #1b1b1b; color: #fff; border: 1px solid #1b1b1b; border-radius: 4px; padding: 5px 10px; cursor: pointer; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <h1>Excel MCP Bridge</h1>
  <div id="status">Loading Office.js…</div>
  <div id="env"></div>
  <!-- Sign-in (PRD §06 path 1): the button opens the hub's /bridge/authorize in an Office dialog,
       which runs the Microsoft sign-in and hands back a 90-day bridge token; the pane keeps it in
       OfficeRuntime.storage and presents it in every hello. Sign out revokes it on the hub too.
       Switch account reuses that same dialog with switch=1, so a session for the wrong Microsoft
       account does not silently bind again: it forces the account chooser. -->
  <div id="account">
    <div id="signed-out">
      <button id="sign-in" class="primary">Sign in with Microsoft</button>
    </div>
    <div id="signed-in" hidden>
      <span class="who">Signed in as <strong id="who"></strong></span>
      <button id="switch-account">Switch account</button>
      <button id="sign-out">Sign out</button>
    </div>
  </div>
  <div>
    <button id="reconnect">Reconnect</button>
    <button id="clear">Clear log</button>
  </div>
  <p id="log"></p>
  <script src="taskpane.js"></script>
</body>
</html>
